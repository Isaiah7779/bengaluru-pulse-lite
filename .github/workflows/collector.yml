name: Traffic collector (scheduled)

# Free replacement for the always-on collector container: Render's free plan has
# no background workers or cron jobs. Each run does one sweep (TomTom flow and
# incidents, Open-Meteo weather) and writes straight to the production database.
# The shared TomTom daily budget is enforced in the database, so this cannot
# exceed the free quota. Requires repository secrets:
#   COLLECTOR_DATABASE_URL  Render database "External Database URL"
#   TOMTOM_API_KEY          optional; without it only weather is collected
# The job is skipped (not failed) until COLLECTOR_DATABASE_URL is set.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      DB_AUTO_CREATE: "false"
      LOG_JSON: "true"
    steps:
      - name: Check configuration
        id: config
        working-directory: .
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "COLLECTOR_DATABASE_URL not set; skipping."; fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.config.outputs.enabled == 'true'
        run: pip install -r requirements.txt
      - if: steps.config.outputs.enabled == 'true'
        run: python -m traffic.collector --once
