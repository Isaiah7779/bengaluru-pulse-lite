name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pulse
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests (OSRM-dependent tests skip without graphs)
        env:
          LIVE_PG_URL: postgresql://pulse:pulse_ci_only@127.0.0.1:5432/pulse
        run: python -m pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql://pulse:pulse_ci_only@127.0.0.1:5432/pulse
        run: |
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false
      - run: CI=true npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform android --output-dir /tmp/export
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pulse-backend:ci backend
      - run: docker build -t pulse-frontend:ci -f frontend/Dockerfile .
      - name: Backend image imports and serves /health without external services
        run: |
          docker run -d --name api -e DB_AUTO_CREATE=true -e DATABASE_URL=sqlite:////tmp/ci.db -p 8000:8000 \
            pulse-backend:ci python -m uvicorn main:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
