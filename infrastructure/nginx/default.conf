server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend through Docker's embedded DNS at request time (re-checked every
    # 10 s) instead of once at start-up, so a recreated backend container with a new IP
    # does not leave nginx proxying to a stale address (502 "connection refused").
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /api/ {
        set $backend_upstream http://backend:8000;
        # Strip the /api prefix (a variable proxy_pass does not do this itself);
        # the query string is kept.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
